services:
  mansou:
    build: .
    ports:
      - "${MANSOU_BIND:-127.0.0.1}:3210:3210"
    environment:
      MANSOU_DATA_DIR: /data
      AUTH_MODE: ${AUTH_MODE:-required}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      # Keep this migration guard: a nonempty legacy token makes startup fail.
      MANSOU_ACCESS_TOKEN: ${MANSOU_ACCESS_TOKEN:-}
      MANSOU_PROXY: ${MANSOU_PROXY:-}
      MANSOU_NO_PROXY: ${MANSOU_NO_PROXY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
