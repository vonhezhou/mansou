services:
  venera-web:
    build: .
    ports:
      - "3210:3210"
    environment:
      VENERA_DATA_DIR: /data
      VENERA_ACCESS_TOKEN: ${VENERA_ACCESS_TOKEN:-}
      VENERA_PROXY: ${VENERA_PROXY:-}
      VENERA_NO_PROXY: ${VENERA_NO_PROXY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
