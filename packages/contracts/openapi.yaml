openapi: 3.1.0
info:
  title: Venera Web API
  version: 0.1.0
  description: Venera HTTP API. Authentication is required unless explicitly
    disabled by AUTH_MODE=none. Browser mutations require Origin and
    X-CSRF-Token; API tokens use Authorization. SSE emits downloads snapshots
    and auth-expired before closing on credential expiry/revocation.
servers:
  - url: /
security:
  - sessionAuth: []
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealthLegacy
      tags:
        - system
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags:
        - system
      summary: OpenAPI document
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/source-repository:
    get:
      operationId: getSourceRepository
      tags:
        - sourceRepository
      summary: List repository sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRepository"
  /api/v1/source-repository/refresh:
    post:
      operationId: refreshSourceRepository
      tags:
        - sourceRepository
      summary: Refresh repository index
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepositorySource"
                required:
                  - sources
  /api/v1/sources:
    get:
      operationId: listSources
      tags:
        - sources
      summary: List installed sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummary"
  /api/v1/sources/available:
    get:
      operationId: listAvailableSources
      tags:
        - sources
      summary: List available repository sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositorySource"
  /api/v1/sources/installed:
    get:
      operationId: listInstalledSources
      tags:
        - sources
      summary: List installed sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceSummary"
  /api/v1/sources/metadata:
    get:
      operationId: listSourceMetadata
      tags:
        - sources
      summary: List persisted source metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceMetadata"
  /api/v1/sources/install:
    post:
      operationId: installSource
      tags:
        - sources
      summary: Install source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
              required:
                - source
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/sources/reload:
    post:
      operationId: reloadSources
      tags:
        - sources
      summary: Reload installed source scripts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/sources/{sourceKey}:
    get:
      operationId: getSource
      tags:
        - sources
      summary: Get source
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SourceSummary"
                  - type: "null"
  /api/v1/sources/{sourceKey}/enabled:
    put:
      operationId: setSourceEnabled
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceMetadata"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sources/{sourceKey}/search-options:
    get:
      operationId: getSourceSearchOptions
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/v1/sources/{sourceKey}/settings:
    get:
      operationId: getSourceSettings
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSettings"
    put:
      operationId: updateSourceSettings
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: true
              required:
                - values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSettings"
    delete:
      operationId: clearSourceSettings
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSettings"
  /api/v1/sources/{sourceKey}/auth:
    get:
      operationId: getSourceAuth
      tags: [sources]
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAuth"
        "400":
          description: Invalid input or unsupported source capability
        "422":
          description: Source login failed
  /api/v1/sources/{sourceKey}/auth/login:
    post:
      operationId: loginSource
      tags: [sources]
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceLogin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAuth"
        "400":
          description: Invalid input or unsupported source capability
        "422":
          description: Source login failed
  /api/v1/sources/{sourceKey}/auth/logout:
    post:
      operationId: logoutSource
      tags: [sources]
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAuth"
        "400":
          description: Invalid input or unsupported source capability
        "422":
          description: Source login failed
  /api/v1/sources/{sourceKey}/settings/{settingKey}/invoke:
    post:
      operationId: invokeSourceSetting
      tags: [sources]
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: settingKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSettings"
        "400":
          description: Invalid input or unsupported source capability
        "422":
          description: Source login failed
  /api/v1/sources/{sourceKey}/cookies:
    get:
      operationId: listSourceCookies
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    put:
      operationId: importSourceCookies
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                cookies:
                  type: array
                  items:
                    anyOf:
                      - type: string
                      - type: object
                        additionalProperties: true
                text:
                  type: string
              required:
                - url
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    delete:
      operationId: clearSourceCookies
      tags:
        - sources
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /api/v1/search:
    get:
      operationId: aggregatedSearch
      tags:
        - search
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: sources
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AggregatedSearchItem"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/search/{sourceKey}:
    get:
      operationId: searchSource
      tags:
        - search
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: next
          in: query
          required: false
          schema:
            type: string
        - name: options
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/comics/{sourceKey}/{comicId}:
    get:
      operationId: getComicDetails
      tags:
        - comics
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicDetails"
  /api/v1/comics/{sourceKey}/detail:
    get:
      operationId: getComicDetailsByQuery
      tags:
        - comics
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicDetails"
  /api/v1/comics/{sourceKey}/{comicId}/episodes/{episodeId}/pages:
    get:
      operationId: getEpisodePages
      tags:
        - comics
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: path
          required: true
          schema:
            type: string
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePages"
  /api/v1/comics/{sourceKey}/pages:
    get:
      operationId: getEpisodePagesByQuery
      tags:
        - comics
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: query
          required: true
          schema:
            type: string
        - name: episodeId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePages"
  /api/v1/image:
    get:
      operationId: getImage
      tags:
        - images
      parameters:
        - name: sourceKey
          in: query
          required: true
          schema:
            type: string
        - name: imageKey
          in: query
          required: true
          schema:
            type: string
        - name: comicId
          in: query
          required: false
          schema:
            type: string
        - name: episodeId
          in: query
          required: false
          schema:
            type: string
        - name: thumbnail
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/downloads:
    get:
      operationId: listDownloads
      tags:
        - downloads
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadTask"
    post:
      operationId: createDownload
      tags:
        - downloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDownloadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/events:
    get:
      operationId: subscribeDownloads
      tags:
        - downloads
      parameters: []
      responses:
        "200":
          description: Server-sent events stream
  /api/v1/downloads/{taskId}:
    get:
      operationId: getDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: files
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/items:
    get:
      operationId: listDownloadItems
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadItem"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/items/retry:
    post:
      operationId: retryDownloadImage
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageKey:
                  type: string
              required:
                - imageKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/DownloadTask"
                  item:
                    $ref: "#/components/schemas/DownloadItem"
                required:
                  - task
                  - item
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/items/retry-failed:
    post:
      operationId: retryFailedDownloadImages
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryFailedDownloadImagesResult"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/cancel:
    post:
      operationId: cancelDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/pause:
    post:
      operationId: pauseDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/resume:
    post:
      operationId: resumeDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/rerun:
    post:
      operationId: rerunDownload
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/downloads/{taskId}/cbz:
    post:
      operationId: exportDownloadCbz
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  path:
                    type: string
                required:
                  - taskId
                  - path
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
    get:
      operationId: downloadCbz
      tags:
        - downloads
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CBZ archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/DownloadConflict"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/settings/cache:
    get:
      operationId: getCacheStats
      tags:
        - settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStats"
  /api/v1/settings/cache/images:
    delete:
      operationId: clearImageCache
      tags:
        - settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStats"
  /api/v1/settings/cache/images/prune:
    post:
      operationId: pruneImageCache
      tags:
        - settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStats"
  /api/v1/debug/runtime/compatibility:
    get:
      operationId: getRuntimeCompatibility
      tags:
        - debug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuntimeCompatibilityItem"
                required:
                  - items
  /api/v1/debug/runtime/diagnostics:
    get:
      operationId: getRuntimeDiagnostics
      tags:
        - debug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDiagnostics"
  /api/v1/debug/{sourceKey}/search:
    get:
      operationId: debugSearch
      tags:
        - debug
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugResult"
  /api/v1/debug/{sourceKey}/comics/{comicId}:
    get:
      operationId: debugComicDetails
      tags:
        - debug
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugResult"
  /api/v1/debug/{sourceKey}/comics/{comicId}/episodes/{episodeId}/pages:
    get:
      operationId: debugEpisodePages
      tags:
        - debug
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: comicId
          in: path
          required: true
          schema:
            type: string
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugResult"
  /api/v1/debug/{sourceKey}/image:
    get:
      operationId: debugImage
      tags:
        - debug
      parameters:
        - name: sourceKey
          in: path
          required: true
          schema:
            type: string
        - name: imageKey
          in: query
          required: true
          schema:
            type: string
        - name: comicId
          in: query
          required: false
          schema:
            type: string
        - name: episodeId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugResult"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags:
        - auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
      description: Requires Origin equal to AUTH_ORIGIN; only available in required
        mode. No public account creation.
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: &a1
            type: string
  /api/v1/auth/password:
    put:
      operationId: changePassword
      tags:
        - auth
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a1
  /api/v1/auth/tokens:
    get:
      operationId: listApiTokens
      tags:
        - auth
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      tags:
        - auth
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiTokenResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
  /api/v1/auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags:
        - auth
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-venera_session
      description: HTTPS session cookie. HTTP development uses venera_session. Unsafe
        session requests require matching Origin and X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque API token for non-browser clients.
  responses:
    DownloadConflict:
      description: Download is busy, being deleted, or not completed for CBZ export.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    Health:
      type: object
      properties:
        ok:
          type: boolean
        name:
          type: string
      required:
        - ok
        - name
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            requestId:
              type: string
          required:
            - code
            - message
      required:
        - error
    RepositorySource:
      type: object
      additionalProperties: true
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: string
        url:
          type: string
        filename:
          type: string
        fileName:
          type: string
    SourceRepository:
      type: object
      properties:
        url:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RepositorySource"
      required:
        - url
        - sources
    SourceSummary:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: string
        url:
          type: string
        filePath:
          type: string
        hasSearch:
          type: boolean
        hasComic:
          type: boolean
        capabilities:
          type: object
          required: [search, details, pages, settings, authentication]
          properties:
            search:
              type: boolean
            details:
              type: boolean
            pages:
              type: boolean
            settings:
              type: boolean
            authentication:
              type: boolean
        searchOptions:
          type: array
          items:
            type: object
            required: [label, options]
            properties:
              label:
                type: string
              type:
                type: string
              options:
                type: array
                items:
                  type: string
              default: {}
      required:
        - key
        - name
    SourceMetadata:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        version:
          type: string
        enabled:
          type: number
        script_path:
          type: string
        script_url:
          type: string
        hash:
          type: string
        installed_at:
          type: string
        updated_at:
          type: string
      required:
        - key
        - name
        - enabled
    SourceAuth:
      type: object
      required: [loggedIn, methods, cookieFields, webview]
      properties:
        loggedIn:
          type: boolean
        methods:
          type: array
          items:
            type: string
            enum: [password, cookies]
        cookieFields:
          type: array
          items:
            type: string
        webview:
          type: string
          enum: [unavailable, unsupported]
        registerUrl:
          type: string
    SourceLogin:
      oneOf:
        - type: object
          required: [method, username, password]
          properties:
            method:
              type: string
              enum: [password]
            username:
              type: string
              minLength: 1
            password:
              type: string
              minLength: 1
              writeOnly: true
        - type: object
          required: [method, values]
          properties:
            method:
              type: string
              enum: [cookies]
            values:
              type: array
              items:
                type: string
    SourceSettingDefinition:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [input, select, switch, callback]
        default: {}
        options:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                required: [value]
                properties:
                  value: {}
                  text:
                    type: string
        validator:
          type: [string, "null"]
        buttonText:
          type: string
    SourceSettings:
      type: object
      properties:
        schema:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceSettingDefinition"
        values:
          type: object
          additionalProperties: true
      required:
        - schema
        - values
    Comic:
      type: object
      additionalProperties: true
      properties:
        sourceKey:
          type: string
        id:
          type: string
        title:
          type: string
        cover:
          type: string
        subtitle:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        language:
          type: string
        stars:
          type: number
      required:
        - id
        - title
    SearchResult:
      type: object
      properties:
        comics:
          type: array
          items:
            $ref: "#/components/schemas/Comic"
        maxPage:
          type: number
        next:
          anyOf:
            - type: string
            - type: "null"
      required:
        - comics
    AggregatedSearchItem:
      type: object
      properties:
        sourceKey:
          type: string
        sourceName:
          type: string
        result:
          $ref: "#/components/schemas/SearchResult"
        error:
          type: string
      required:
        - sourceKey
        - sourceName
    ComicDetails:
      allOf:
        - $ref: "#/components/schemas/Comic"
        - type: object
          additionalProperties: true
          properties:
            comicId:
              type: string
            chapters:
              type: object
              additionalProperties:
                type: string
            thumbnails:
              type: array
              items:
                type: string
    EpisodePages:
      type: object
      properties:
        images:
          type: array
          items:
            type: string
      required:
        - images
    CreateDownloadRequest:
      type: object
      properties:
        sourceKey:
          type: string
        comicId:
          type: string
        episodeId:
          type: string
        all:
          type: boolean
      required:
        - sourceKey
        - comicId
    DownloadLog:
      type: object
      properties:
        time:
          type: string
        phase:
          type: string
        message:
          type: string
      required:
        - time
        - phase
        - message
    DownloadTask:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        sourceKey:
          type: string
        comicId:
          type: string
        episodeId:
          type: string
        all:
          type: boolean
        title:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - paused
            - completed
            - failed
            - cancelled
        phase:
          type: string
        total:
          type: number
        completed:
          type: number
        error:
          type: string
        errorCode:
          type: string
        recovered:
          type: boolean
        current:
          type: string
        outputDir:
          type: string
        logs:
          type: array
          items:
            $ref: "#/components/schemas/DownloadLog"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - sourceKey
        - comicId
        - episodeId
        - status
        - phase
        - total
        - completed
        - logs
        - createdAt
        - updatedAt
    DownloadItem:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        image_key:
          type: string
        file_path:
          type: string
        status:
          type: string
        retry_count:
          type: number
        error:
          type: string
        error_code:
          type: string
        updated_at:
          type: string
      required:
        - id
        - task_id
        - image_key
        - status
        - retry_count
        - updated_at
    RetryFailedDownloadImagesResult:
      type: object
      properties:
        task:
          anyOf:
            - $ref: "#/components/schemas/DownloadTask"
            - type: "null"
        retried:
          type: number
        results:
          type: array
          items:
            type: object
            properties:
              imageKey:
                type: string
              ok:
                type: boolean
              result:
                type: object
                additionalProperties: true
              error:
                type: string
            required:
              - imageKey
              - ok
      required:
        - task
        - retried
        - results
    CacheStats:
      type: object
      properties:
        files:
          type: number
        bytes:
          type: number
      required:
        - files
        - bytes
    RuntimeCompatibilityItem:
      type: object
      properties:
        area:
          type: string
        api:
          type: string
        status:
          type: string
        note:
          type: string
      required:
        - area
        - api
        - status
    RuntimeDiagnostic:
      type: object
      properties:
        time:
          type: string
        sourceKey:
          type: string
        operation:
          type: string
        code:
          type: string
        message:
          type: string
      required:
        - time
        - operation
        - code
        - message
    RuntimeDiagnostics:
      type: object
      properties:
        isolation:
          type: string
        loadedSources:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummary"
        failedLoads:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagnostic"
        recentErrors:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagnostic"
        sourceConcurrency:
          type: array
          items:
            type: object
            properties:
              sourceKey:
                type: string
              active:
                type: number
              queued:
                type: number
            required:
              - sourceKey
              - active
              - queued
      required:
        - isolation
        - loadedSources
        - failedLoads
        - recentErrors
        - sourceConcurrency
    DebugResult:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        name:
          type: string
        durationMs:
          type: number
        summary: {}
        error:
          type: string
        hint:
          type: string
        stack:
          type: array
          items:
            type: string
      required:
        - ok
        - name
        - durationMs
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - none
            - required
        authenticated:
          type: boolean
        initialized:
          type: boolean
        username: *a1
        csrfToken: *a1
        expiresAt:
          type: integer
          description: Unix milliseconds
      required:
        - mode
        - authenticated
        - initialized
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
        - username
        - password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        oldPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
        - oldPassword
        - newPassword
    ApiToken:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt: &a2
          type: integer
          format: int64
        expiresAt: &a3
          anyOf:
            - *a2
            - type: "null"
      required:
        - id
        - name
        - createdAt
        - expiresAt
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        expiresAt: *a3
      required:
        - name
    CreateApiTokenResult:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Shown once. Store securely; never available from the list endpoint.
        entry:
          $ref: "#/components/schemas/ApiToken"
      required:
        - token
        - entry
